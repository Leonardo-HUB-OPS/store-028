<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
  <title>LaVacaStore — Mobile</title>
  <style>
    :root{
      --bg:#f6f6f6; --card:#fff; --accent:#000; --green:#25D366; --danger:#ef4444; --muted:#666;
    }
    /* Mobile-first reset */
    *{box-sizing:border-box}
    html,body{height:100%}
    body{margin:0;font-family:Inter, system-ui, -apple-system, 'Segoe UI', Roboto, Arial; background:var(--bg); color:#111;-webkit-font-smoothing:antialiased}

    /* Header */
    header{position:sticky;top:0;z-index:50;background:var(--accent);color:#fff;padding:10px 12px;display:flex;align-items:center;justify-content:space-between;gap:8px}
    .brand{display:flex;align-items:center;gap:10px}
    .brand h1{margin:0;font-size:18px}
    .header-actions{display:flex;gap:8px;align-items:center}
    .icon-btn{background:transparent;border:none;color:#fff;padding:8px;border-radius:8px;font-weight:700;cursor:pointer}
    .pill{background:#fff;color:var(--accent);padding:6px 10px;border-radius:999px;font-weight:800}

    /* Layout */
    .container{max-width:720px;margin:10px auto;padding:0 12px 80px}
    .notice{background:#fff3f3;border-left:5px solid var(--danger);padding:10px;border-radius:10px;margin:12px 0;font-weight:700;color:#900;text-align:center}

    /* Hero */
    .hero{background:var(--card);padding:12px;border-radius:12px;box-shadow:0 6px 18px rgba(0,0,0,.04);display:flex;gap:12px;align-items:center}
    .hero img{width:40%;height:120px;object-fit:cover;border-radius:8px}
    .hero-info{flex:1}
    .hero-info h2{margin:0 0 6px;font-size:16px}
    .hero-info p{margin:0 0 6px;font-size:13px;color:var(--muted)}
    .hero-cta{display:flex;gap:8px;flex-wrap:wrap}
    .btn{background:var(--accent);color:#fff;border:none;padding:10px 12px;border-radius:10px;cursor:pointer;font-weight:700;flex:1}
    .btn-ghost{background:transparent;border:1px solid #eee;color:var(--accent)}
    .btn-green{background:var(--green);color:#fff}

    /* Vitrine */
    .vitrine{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:12px}
    .produto{background:var(--card);padding:10px;border-radius:12px;box-shadow:0 6px 18px rgba(0,0,0,.04);text-align:center;display:flex;flex-direction:column;gap:8px}
    .produto img{width:100%;height:120px;object-fit:cover;border-radius:8px}
    .produto h3{margin:0;font-size:14px}
    .produto p{margin:0;font-size:12px;color:var(--muted)}
    .produto .price{font-weight:800}
    .produto button{margin-top:auto;padding:8px;border-radius:8px;border:none;background:var(--accent);color:#fff;cursor:pointer}
    .tag-out{display:none;position:absolute;left:50%;top:46%;transform:translate(-50%,-50%);background:rgba(0,0,0,.85);color:#fff;padding:6px 8px;border-radius:8px;font-weight:700}
    .produto.fora-estoque{opacity:.5;pointer-events:none;filter:grayscale(80%)}

    /* Carrinho fixo inferior */
    .cart-bar{position:fixed;left:12px;right:12px;bottom:12px;background:var(--card);padding:10px;border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.12);display:flex;align-items:center;gap:10px;z-index:60}
    .cart-info{flex:1}
    .cart-info small{color:var(--muted)}
    .cart-btn{background:var(--accent);color:#fff;border:none;padding:10px 12px;border-radius:10px;font-weight:800}

    /* Drawer / modal pix & admin */
    .drawer{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top-left-radius:16px;border-top-right-radius:16px;padding:14px;box-shadow:0 -10px 30px rgba(0,0,0,.12);z-index:70;max-height:80vh;overflow:auto}
    .hidden{display:none}
    .pix-key{font-weight:900;font-size:18px;word-break:break-word;margin:8px 0}
    .whatsapp-link{display:inline-block;background:var(--green);color:#fff;padding:10px 12px;border-radius:10px;text-decoration:none}

    /* Admin panel (compact) */
    .admin-panel{padding:10px}
    .admin-row{display:flex;gap:8px;flex-wrap:wrap}
    .admin-input{padding:8px;border-radius:8px;border:1px solid #e6e6e6;flex:1}

    footer{display:block;text-align:center;color:var(--muted);margin:20px 0 60px}

    /* Larger screens adjustments */
    @media(min-width:700px){
      .vitrine{grid-template-columns:repeat(3,1fr)}
      .hero img{height:140px}
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <button class="icon-btn" aria-label="menu" onclick="window.scrollTo({top:0,behavior:'smooth'})">🐮</button>
      <h1>LaVacaStore</h1>
    </div>
    <div class="header-actions">
      <span class="pill">Entrega: WHATS</span>
      <button class="icon-btn" onclick="openAdmin()">🔒 Admin</button>
    </div>
  </header>

  <main class="container">
    <div class="notice">⚠️ Antes de comprar, entre em contato pelo WhatsApp (51) 98307-7917 e envie o comprovante.</div>

    <section id="hero" class="hero" aria-label="destaque"></section>

    <section id="vitrine" class="vitrine" aria-label="produtos"></section>

    <footer>© 2025 LaVacaStore</footer>
  </main>

  <!-- Cart bar -->
  <div class="cart-bar" id="cartBar">
    <div style="display:flex;gap:8px;align-items:center">
      <img id="cartThumb" src="" alt="" style="width:48px;height:48px;border-radius:8px;object-fit:cover;display:none">
    </div>
    <div class="cart-info">
      <div id="cartSummary"><strong>🛒 Carrinho</strong><br><small id="cartCount">Vazio</small></div>
    </div>
    <div>
      <button class="cart-btn" onclick="openCart()">Ver / Pagar</button>
    </div>
  </div>

  <!-- Drawer: cart / pix / admin -->
  <div id="drawer" class="drawer hidden" role="dialog" aria-modal="true"></div>

  <script>
    /* ===== CONFIG ===== */
    const PIX_KEY = "c2806e70-26b1-4f6a-9091-ae42594134f1";
    const WHATSAPP_NUMBER = "5551983077917";
    const ADMIN_PASSWORD = "minhasenhasegura123";

    /* Produtos iniciais (igual ao arquivo original) */
    const initialProducts = [
      { sku:"67", nome:"67", desc:"39.3M por segundo", preco:40.00, img:"imagens/67.jpg", tipo:"normal" },
      { sku:"esok", nome:"Esok Sekolah", desc:"30M por segundo", preco:35.00, img:"imagens/esok.png", tipo:"normal" },
      { sku:"perrito1", nome:"Perrito Burrito", desc:"15.5M por segundo", preco:17.00, img:"imagens/perrito1.jpg", tipo:"normal" },
      { sku:"perrito2", nome:"Perrito Burrito (18.5M)", desc:"18.5M por segundo", preco:20.00, img:"imagens/perrito2.jpg", tipo:"normal" },
      { sku:"metodo", nome:"Método Moreira", desc:"Versão básica", preco:5.00, img:"imagens/metodo.jpg", tipo:"metodo" },
      { sku:"metodo_plus", nome:"Método Moreira (Plus)", desc:"Versão Plus", preco:7.50, img:"imagens/metodo_plus.jpg", tipo:"metodo" },
      { sku:"metodo_premium", nome:"Método Moreira (Premium Plus)", desc:"Versão Premium", preco:10.00, img:"imagens/metodo_premium.jpg", tipo:"metodo" }
    ];

    /* Estado */
    function loadState(){
      const p = localStorage.getItem("lv_produtos");
      const d = localStorage.getItem("lv_disponibilidade");
      let produtos = p ? JSON.parse(p) : null;
      let disponibilidade = d ? JSON.parse(d) : null;
      if(!produtos){ produtos = initialProducts.slice(); localStorage.setItem("lv_produtos", JSON.stringify(produtos)); }
      if(!disponibilidade){ disponibilidade = {}; produtos.forEach(x => disponibilidade[x.sku] = true); localStorage.setItem("lv_disponibilidade", JSON.stringify(disponibilidade)); }
      return { produtos, disponibilidade };
    }

    let { produtos, disponibilidade } = loadState();
    let carrinho = [];

    /* Elementos */
    const heroEl = document.getElementById('hero');
    const vitrineEl = document.getElementById('vitrine');
    const drawer = document.getElementById('drawer');
    const cartBar = document.getElementById('cartBar');
    const cartThumb = document.getElementById('cartThumb');
    const cartCount = document.getElementById('cartCount');

    /* Render */
    function criarCardProduto(p){
      const div = document.createElement('div');
      div.className = 'produto';
      div.dataset.sku = p.sku;
      if(!disponibilidade[p.sku]) div.classList.add('fora-estoque');

      const img = document.createElement('img'); img.src = p.img; img.alt = p.nome;
      img.onerror = ()=>{ img.src = 'data:image/svg+xml;utf8,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300"><rect width="100%" height="100%" fill="#ddd"/><text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" fill="#666">Imagem não disponível</text></svg>'); };

      const h3 = document.createElement('h3'); h3.textContent = p.nome;
      const pdesc = document.createElement('p'); pdesc.textContent = p.desc;
      const price = document.createElement('div'); price.className = 'price'; price.textContent = 'R$ ' + Number(p.preco).toFixed(2);
      const btn = document.createElement('button'); btn.textContent = 'Adicionar'; btn.onclick = ()=> adicionarAoCarrinho(p.sku);

      div.appendChild(img);
      div.appendChild(h3);
      div.appendChild(pdesc);
      div.appendChild(price);
      div.appendChild(btn);

      return div;
    }

    function renderHero(){
      const p = produtos[0];
      if(!p){ heroEl.style.display = 'none'; return; }
      heroEl.style.display = 'flex';
      heroEl.innerHTML = `
        <img src="${p.img}" alt="${p.nome}">
        <div class="hero-info">
          <h2>${p.nome}</h2>
          <p>${p.desc}</p>
          <div style="display:flex;gap:8px;margin-top:8px" class="hero-cta">
            <button class="btn" onclick="adicionarAoCarrinho('${p.sku}')">Adicionar</button>
            <button class="btn btn-green" onclick="comprarDestaque('${p.sku}')">Comprar agora</button>
          </div>
        </div>
      `;
    }

    function renderVitrine(){
      vitrineEl.innerHTML = '';
      produtos.forEach(p => vitrineEl.appendChild(criarCardProduto(p)));
    }

    /* Carrinho */
    function adicionarAoCarrinho(sku){
      if(!disponibilidade[sku]) { alert('Produto indisponível.'); return; }
      const p = produtos.find(x=>x.sku===sku);
      carrinho.push({ sku:p.sku, nome:p.nome, img:p.img, desc:p.desc, preco:p.preco, tipo:p.tipo });
      atualizarCartBar();
    }

    function atualizarCartBar(){
      if(carrinho.length === 0){ cartCount.textContent = 'Vazio'; cartThumb.style.display = 'none'; return; }
      const total = carrinho.reduce((s,it)=>s+Number(it.preco),0);
      cartCount.textContent = `${carrinho.length} item(s) • R$ ${total.toFixed(2)}`;
      cartThumb.src = carrinho[carrinho.length-1].img;
      cartThumb.style.display = '';
    }

    function openCart(){
      drawer.innerHTML = '';
      if(carrinho.length === 0){ drawer.innerHTML = '<h3>Carrinho</h3><p class="small">Carrinho vazio</p><div style="margin-top:12px"><button class="btn" onclick="closeDrawer()">Fechar</button></div>'; drawer.classList.remove('hidden'); return; }

      let html = '<h3>🛒 Carrinho</h3>';
      cartItemsHtml = '<div style="display:flex;flex-direction:column;gap:10px;margin-top:8px">';
      carrinho.forEach((it, idx)=>{
        cartItemsHtml += `<div style="display:flex;gap:8px;align-items:center"><img src="${it.img}" style="width:60px;height:60px;object-fit:cover;border-radius:8px"/><div style="flex:1"><strong>${it.nome}</strong><br><small style="color:var(--muted)">${it.desc} • R$ ${Number(it.preco).toFixed(2)}</small></div><button style="background:var(--danger);color:#fff;border:none;padding:8px;border-radius:8px" onclick="removerDoCarrinho(${idx})">Remover</button></div>`;
      });
      cartItemsHtml += '</div>';
      const total = carrinho.reduce((s,it)=>s+Number(it.preco),0);
      html += cartItemsHtml + `<div style="margin-top:12px"><strong>Total: R$ ${total.toFixed(2)}</strong></div>`;
      html += `<div style="margin-top:12px;display:flex;gap:8px"><button class="btn" onclick="pagarPix()">Pagar com Pix</button><button class="btn btn-ghost" onclick="closeDrawer()">Fechar</button></div>`;
      drawer.innerHTML = html;
      drawer.classList.remove('hidden');
    }

    function closeDrawer(){ drawer.classList.add('hidden'); }

    function removerDoCarrinho(i){ carrinho.splice(i,1); atualizarCartBar(); openCart(); }

    function comprarDestaque(sku){ const exists = carrinho.some(c=>c.sku===sku); if(!exists) adicionarAoCarrinho(sku); pagarPix(); }

    /* PIX */
    function pagarPix(){
      if(carrinho.length === 0){ alert('Adicione pelo menos um produto antes de pagar.'); return; }
      const produtosComprados = [...new Set(carrinho.map(it=>it.nome))].join(', ');
      drawer.innerHTML = `
        <h3>Use a chave Pix abaixo para realizar o pagamento:</h3>
        <div class="pix-key">${PIX_KEY}</div>
        <p>💬 Após pagar, envie o comprovante para o nosso WhatsApp:</p>
        <a class="whatsapp-link" href="https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent('Olá! Acabei de comprar: ' + produtosComprados + '. Segue o comprovante.') }" target="_blank">📲 Enviar comprovante no WhatsApp</a>
        <div style="margin-top:12px;display:flex;gap:8px"><button class="btn" onclick="confirmarPagamento()">Confirmar pagamento</button><button class="btn btn-ghost" onclick="cancelarPagamento()">Cancelar</button></div>
      `;
      drawer.classList.remove('hidden');
    }

    function confirmarPagamento(){
      const skusComprados = [...new Set(carrinho.map(it=>it.sku))];
      skusComprados.forEach(sku=>{ const prod = produtos.find(p=>p.sku===sku); if(prod && prod.tipo !== 'metodo'){ disponibilidade[sku] = false; } });
      localStorage.setItem('lv_produtos', JSON.stringify(produtos));
      localStorage.setItem('lv_disponibilidade', JSON.stringify(disponibilidade));
      drawer.innerHTML = '<h3>✅ Pedido registrado. Envie o comprovante no WhatsApp para finalizar o atendimento.</h3><div style="margin-top:12px"><button class="btn" onclick="closeDrawer()">Fechar</button></div>';
      carrinho = [];
      atualizarCartBar();
      renderVitrine();
    }

    function cancelarPagamento(){ closeDrawer(); }

    /* ADMIN */
    let isAdmin = false;
    function openAdmin(){
      const senha = prompt('Digite a senha do admin:');
      if(senha === ADMIN_PASSWORD){ isAdmin = true; renderAdmin(); drawer.classList.remove('hidden'); } else { alert('Senha incorreta.'); }
    }

    function renderAdmin(){
      if(!isAdmin) return alert('Somente admin.');
      let html = '<h3>Modo Admin</h3>';
      html += `<div class="admin-panel"><div class="admin-row"><input id="novo-nome" class="admin-input" placeholder="Nome do produto"><input id="novo-preco" class="admin-input" placeholder="Preço (ex: 35.00)"></div><div style="margin-top:8px;display:flex;gap:8px"><input id="novo-imagem" type="file" accept="image/*" class="admin-input"><select id="novo-tipo" class="admin-input"><option value="normal">normal</option><option value="metodo">metodo</option></select><button class="btn btn-green" onclick="adicionarProdutoAdmin()">➕ Adicionar</button></div></div>`;
      html += '<hr>';
      html += '<h4>Produtos</h4>';
      html += '<div style="display:flex;flex-direction:column;gap:8px">';
      produtos.forEach(p=>{
        html += `<div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><div style="display:flex;gap:8px;align-items:center"><img src="${p.img}" style="width:60px;height:48px;object-fit:cover;border-radius:6px"><div><strong>${p.nome}</strong><br><small style=\"color:var(--muted)\">R$ ${Number(p.preco).toFixed(2)} • ${p.tipo}</small></div></div><div style=\"display:flex;gap:6px\">${disponibilidade[p.sku] ? `<button class=\"btn\" onclick=\"removerEstoque('${p.sku}')\">Remover estoque</button>` : `<button class=\"btn btn-green\" onclick=\"ativarEstoque('${p.sku}')\">Reativar</button>` }<button class=\"btn\" style=\"background:#666\" onclick=\"excluirProduto('${p.sku}')\">Excluir</button></div></div>`;
      });
      html += '</div>';
      drawer.innerHTML = html;
    }

    function logoutAdmin(){ isAdmin = false; closeDrawer(); alert('Você saiu do modo admin.'); }

    function adicionarProdutoAdmin(){
      if(!isAdmin){ alert('Somente admin pode adicionar produtos.'); return; }
      const nome = document.getElementById('novo-nome').value.trim();
      const precoStr = document.getElementById('novo-preco').value.trim();
      const fileInput = document.getElementById('novo-imagem');
      const tipo = document.getElementById('novo-tipo').value;
      if(!nome || !precoStr || !fileInput.files.length){ alert('Preencha nome, preço e escolha uma imagem.'); return; }
      const preco = parseFloat(precoStr.replace(',','.'));
      if(isNaN(preco)){ alert('Preço inválido.'); return; }
      const file = fileInput.files[0];
      const reader = new FileReader();
      reader.onload = function(e){
        const dataUrl = e.target.result;
        const sku = 'custom-' + Date.now();
        const novo = { sku, nome, desc: '', preco: preco, img: dataUrl, tipo };
        produtos.push(novo);
        disponibilidade[sku] = true;
        localStorage.setItem('lv_produtos', JSON.stringify(produtos));
        localStorage.setItem('lv_disponibilidade', JSON.stringify(disponibilidade));
        renderVitrine();
        renderAdmin();
        alert('✅ Produto adicionado (permanece após fechar).');
      };
      reader.readAsDataURL(file);
    }

    function removerEstoque(sku){ if(!isAdmin){ alert('Somente admin pode remover do estoque.'); return; } if(!confirm('Remover este produto do estoque?')) return; disponibilidade[sku] = false; localStorage.setItem('lv_disponibilidade', JSON.stringify(disponibilidade)); renderVitrine(); renderAdmin(); }
    function ativarEstoque(sku){ if(!isAdmin){ alert('Somente admin pode reativar.'); return; } disponibilidade[sku] = true; localStorage.setItem('lv_disponibilidade', JSON.stringify(disponibilidade)); renderVitrine(); renderAdmin(); }
    function excluirProduto(sku){ if(!isAdmin){ alert('Somente admin pode excluir.'); return; } if(!confirm('Excluir este produto permanentemente?')) return; produtos = produtos.filter(p=>p.sku !== sku); delete disponibilidade[sku]; localStorage.setItem('lv_produtos', JSON.stringify(produtos)); localStorage.setItem('lv_disponibilidade', JSON.stringify(disponibilidade)); renderVitrine(); renderAdmin(); }

    /* Inicialização */
    renderHero(); renderVitrine(); atualizarCartBar();

    // Atalhos: Alt+F1 para admin (mesmo comportamento do original)
    document.addEventListener('keydown', (e) => { if (e.altKey && e.key === 'F1') { e.preventDefault(); openAdmin(); } });

    // Expor funções globais necessárias pelos handlers inline
    window.adicionarAoCarrinho = adicionarAoCarrinho;
    window.comprarDestaque = comprarDestaque;
    window.pagarPix = pagarPix;
    window.confirmarPagamento = confirmarPagamento;
    window.cancelarPagamento = cancelarPagamento;
    window.openAdmin = openAdmin;
    window.logoutAdmin = logoutAdmin;
    window.adicionarProdutoAdmin = adicionarProdutoAdmin;
    window.removerEstoque = removerEstoque;
    window.ativarEstoque = ativarEstoque;
    window.excluirProduto = excluirProduto;
    window.openCart = openCart;
    window.closeDrawer = closeDrawer;
  </script>
</body>
</html>
